name: CMake multi-platform (Clang 20)

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-clang20
            build_type: Release
            c_compiler: clang-20
            cpp_compiler: clang++-20
            generator: Ninja
            output_tag: linux-clang
            vcpkg_target_triplet: x64-linux-dynamic

          - os: ubuntu-latest
            name: linux-gcc
            build_type: Release
            c_compiler: gcc
            cpp_compiler: g++
            generator: Ninja
            output_tag: linux-gcc
            vcpkg_target_triplet: x64-linux-dynamic

          - os: windows-latest
            name: windows-clang20
            build_type: Release
            c_compiler: clang
            cpp_compiler: clang++
            generator: Ninja
            output_tag: windows-clang
            vcpkg_target_triplet: x64-windows-static

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Clang 20 toolchain (Ubuntu)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y wget gnupg lsb-release software-properties-common ninja-build
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 20
        sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 100
        sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 100

    - name: Install LLVM Clang + Ninja (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install -y llvm ninja --no-progress
        $llvmBin = 'C:\Program Files\LLVM\bin'
        if (-not (Test-Path (Join-Path $llvmBin 'clang++.exe'))) {
          throw "clang++.exe not found in $llvmBin"
        }
        "$llvmBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Set reusable strings
      id: strings
      shell: bash
      run: echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: >
        cmake -G ${{ matrix.generator }} -S ${{ github.workspace }}
        -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_target_triplet }}

    - name: Configure (Windows - LLVM Clang + Ninja)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $llvmBin = 'C:\Program Files\LLVM\bin'
        $clang = Join-Path $llvmBin 'clang.exe'
        $clangxx = Join-Path $llvmBin 'clang++.exe'

        if (-not (Test-Path $clang) -or -not (Test-Path $clangxx)) {
          throw "LLVM clang binaries not found at $llvmBin"
        }

        cmake -G "${{ matrix.generator }}" `
          -S "${{ github.workspace }}" `
          -B "${{ steps.strings.outputs.build-output-dir }}" `
          -DCMAKE_C_COMPILER="$clang" `
          -DCMAKE_CXX_COMPILER="$clangxx" `
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
          -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_target_triplet }}

    - name: Build
      shell: bash
      run: cmake --build "${{ steps.strings.outputs.build-output-dir }}" --parallel --config "${{ matrix.build_type }}" --target cast main front

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.name }}
        path: out/${{ matrix.output_tag }}/bin/Release/**
        if-no-files-found: error

  release:
    name: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-assets

    - name: Publish GitHub Release and attach binaries
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          release-assets/**/*

