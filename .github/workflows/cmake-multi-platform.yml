name: CMake multi-platform (Clang 20)

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-clang20
            build_type: Release
            c_compiler: clang-20
            cpp_compiler: clang++-20
            generator: Ninja
            output_tag: linux-clang
            vcpkg_target_triplet: x64-linux-dynamic

          - os: ubuntu-latest
            name: linux-gcc
            build_type: Release
            c_compiler: gcc
            cpp_compiler: g++
            generator: Ninja
            output_tag: linux-gcc
            vcpkg_target_triplet: x64-linux-dynamic

          - os: windows-latest
            name: windows-clangcl20-vs2026
            build_type: Release
            generator: Visual Studio 18 2026
            platform: x64
            toolset: ClangCL
            output_tag: windows-clangcl

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Clang 20 toolchain (Ubuntu)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y wget gnupg lsb-release software-properties-common ninja-build
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 20
        sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 100
        sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 100

    - name: Set reusable strings
      id: strings
      shell: bash
      run: echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: >
        cmake -G ${{ matrix.generator }} -S ${{ github.workspace }}
        -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_target_triplet }}

    - name: Configure (Windows - VS + ClangCL 20)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
        if (-not (Test-Path $vswhere)) {
          throw "vswhere.exe not found at $vswhere"
        }

        $vsInstall = & $vswhere -latest -products * -version "[18.0,19.0)" -property installationPath | Select-Object -First 1
        $generator = "Visual Studio 18 2026"

        if (-not $vsInstall) {
          Write-Warning "Visual Studio 2026 not found on this runner. Falling back to VS 2022."
          $vsInstall = & $vswhere -latest -products * -version "[17.0,18.0)" -property installationPath | Select-Object -First 1
          $generator = "Visual Studio 17 2022"
        }

        if (-not $vsInstall) {
          throw "No supported Visual Studio installation found (expected VS 2026 or VS 2022)."
        }

        $vsDevCmd = Join-Path $vsInstall "Common7\Tools\VsDevCmd.bat"
        if (-not (Test-Path $vsDevCmd)) {
          throw "VsDevCmd.bat not found at $vsDevCmd"
        }

        $llvmDir = Join-Path $vsInstall "VC\Tools\Llvm\x64"
        if (-not (Test-Path $llvmDir)) {
          throw "LLVM directory not found at $llvmDir"
        }

        $cmdScript = @"
        @echo off
        call "$vsDevCmd" -arch=${{ matrix.platform }} -host_arch=x64
        cmake -G "$generator" ^
          -T ${{ matrix.toolset }} ^
          -A ${{ matrix.platform }} ^
          -S "%GITHUB_WORKSPACE%" ^
          -B "${{ steps.strings.outputs.build-output-dir }}" ^
          "-DCMAKE_VS_GLOBALS=LLVMInstallDir=$llvmDir;LLVMToolsVersion=20"
        "@

        $scriptPath = Join-Path $env:RUNNER_TEMP "configure-vs-clangcl.cmd"
        Set-Content -Path $scriptPath -Value $cmdScript -Encoding Ascii
        cmd /d /c "`"$scriptPath`""
        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }

    - name: Build
      shell: bash
      run: cmake --build "${{ steps.strings.outputs.build-output-dir }}" --parallel --config "${{ matrix.build_type }}" --target cast main front

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.name }}
        path: out/${{ matrix.output_tag }}/bin/Release/**
        if-no-files-found: error

  release:
    name: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-assets

    - name: Publish GitHub Release and attach binaries
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          release-assets/**/*

